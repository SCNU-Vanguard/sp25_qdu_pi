# 当前树莓派真车主配置；standard 与 standard_readonly 共用，后者在代码中强制只读。
enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
# Hailo 模型与当前已验证的检测参数。
min_confidence: 0.8

# [9.21-QDU-NORMAL-TX] Pi/Hailo production detector selected for the normal SP25 standard chain.
hailo_model: szu-int16-head-l
hef_path: /home/xiao/workspace/current/pi-camera-249fps-20260822-product-arm64/source-live/Modules/ArmorDetector/model/szu_int16_head_l.hef
nms_iou: 0.5
lightbar_refine:
  enabled: true
  threshold: 150
  min_length: 6.0
  max_corner_shift_ratio: 0.75

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

# [9.9-1] 旧 Detector 已删除，传统灯条识别专用参数一并移除。

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 2 # degree -2.5
pitch_offset: 6.5 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value
max_host_frame_age_ms: 50 # [9.9-10] Aimer 入口主机帧龄上限；不等同于曝光到命令延迟。

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: false # [9.21-QDU-NORMAL-TX] Integration stage sends aim angles but never authorizes firing.

camera_name: "hikrobot"
exposure_ms: 3.0
gain: 10.0
# [9.21-QDU-NORMAL-TX] Reuse the camera settings already validated at 720x540 / 100 FPS.
rotate_180: true
serial_number: "DA6589759"
external_trigger: false
trigger_source: "Line0"
trigger_activation: "RisingEdge"
acquisition_frame_rate: 100.0
decimation_horizontal: 2
decimation_vertical: 2
expected_width: 720
expected_height: 540
pool_size: 4
grab_timeout_ms: 100
read_timeout_ms: 250
reconnect_delay_ms: 1000
reconnect_after_timeouts: 10

# 暂沿用单位阵；真实 C 板姿态所用轴向及其与 SP25 云台系的关系尚待确认。
# identity 模拟姿态不能验证这一项，不能仅凭 topic 名称认定两套坐标系相同。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 相机内参：DA6589759，720x540，2x下采样，图像旋转180°；2026-09-25 8mm
# 重投影误差: 0.0417px；2026-09-25 8mm
camera_matrix: [1177.1042630293387, 0, 358.81551783016033, 0, 1175.967328042588, 259.46815557581357, 0, 0, 1]
distort_coeffs: [-0.10756990989656506, 0.16214871294707353, -0.00020333708572492702, 0.00059129519388400069, 0]

# 2026-09-26：采用已通过固定相机/identity 模拟姿态基础跟踪检查的临时理想方向。
# 针对最终发布的图像（已 rotate_180）：相机 C 为 x右/y下/z前，SP25 云台 G 为 x前/y左/z上。
# 此矩阵使 (x_G,y_G,z_G)=(z_C,-x_C,-y_C)，尚不包含实测安装偏角；后续由手眼标定替换。
# 不再对其他车辆的旧外参机械翻转前两列；画面方向、内参和外参必须对应同一成像配置。
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
# 仍是沿用的旧平移值（m），不是本机实测。本次与已验证的临时配置一致，只改变旋转矩阵。
t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]

#####-----QDU C-board communication-----#####
# [9.21-QDU] QDU DevC-USB uses USB CDC serial, 115200 8N1, and SharedTopic frames.
qdu_communication:
  # Stable per-device symlink; it remains valid if the ttyACM number changes after hotplug.
  device: "/dev/serial/by-id/usb-QDU-Future_MainCtrl_QDU-Future-MainCtrl-89ABCDEF0123456701234567470054000E50485939373620-if00"
  baud_rate: 115200
  # [9.21-QDU-NORMAL-TX] Enable real Aimer target_euler output in the normal standard program.
  # Intrinsics updated 2026-09-25; mount extrinsics and real closed-loop operation still need validation.
  tx_enabled: true
  reconnect_interval_ms: 500
  read_timeout_ms: 10
  # A missing quaternion beyond this interval makes the link stale and inhibits TX.
  stale_timeout_ms: 250
  # The supplied RX contract has no mode or live bullet-speed topic; use explicit defaults.
  default_mode: "auto_aim"
  default_bullet_speed: 21.7
  # Sentry uses ahrs_quaternion; the general configuration uses gimbal_quat.
  quaternion_topics: ["ahrs_quaternion", "gimbal_quat"]

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
# [9.9-1] 旧打符模型已删除；待独立确认打符 HEF 后再配置。

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
