#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# [9.21-QDU-NORMAL-TX] Provisional geometric conversion of the original SP25 calibration:
# 2x decimation halves fx/fy/cx/cy; the verified 180-degree image rotation mirrors the principal
# point and tangential coefficients.  This permits protocol/chain testing, but is not a replacement
# for calibrating DA6589759 with its current lens and mount before a gimbal is connected.
camera_matrix: [892.7440763411153, 0, 382.7596760875787, 0, 892.513009735281, 259.05198387602843, 0, 0, 1]
distort_coeffs: [-0.076005079619881746, 0.11182817466388446, -0.0005362204787722057, 0.0027546300984895122, 0]

# 相机同理想情况的偏角: yaw1.44 pitch-7.28 roll0.96 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree
# [9.21-QDU-NORMAL-TX] The first two columns are flipped because software rotation reverses the
# camera optical x/y axes.  Mount accuracy remains pending real hand-eye calibration.
R_camera2gimbal: [0.027182119030230909, 0.12616154330853446, 0.99163723074269183, 0.99949106557517331, -0.019998323121329122, -0.024853106601381177, 0.016695575474690555, 0.99180811252093692, -0.12664093215554434]
t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]

#####-----QDU C-board communication-----#####
# [9.21-QDU] QDU DevC-USB uses USB CDC serial, 115200 8N1, and SharedTopic frames.
qdu_communication:
  # Stable per-device symlink; it remains valid if the ttyACM number changes after hotplug.
  device: "/dev/serial/by-id/usb-QDU-Future_MainCtrl_QDU-Future-MainCtrl-89ABCDEF0123456701234567470054000E50485939373620-if00"
  baud_rate: 115200
  # [9.21-QDU-NORMAL-TX] Enable real Aimer target_euler output in the normal standard program.
  # Do not connect gimbal/launcher actuators until the provisional calibration is replaced/verified.
  tx_enabled: true
  reconnect_interval_ms: 500
  read_timeout_ms: 10
  # A missing quaternion beyond this interval makes the link stale and inhibits TX.
  stale_timeout_ms: 250
  # The supplied RX contract has no mode or live bullet-speed topic; use explicit defaults.
  default_mode: "auto_aim"
  default_bullet_speed: 21.7
  # Sentry uses ahrs_quaternion; the general configuration uses gimbal_quat.
  quaternion_topics: ["ahrs_quaternion", "gimbal_quat"]

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

